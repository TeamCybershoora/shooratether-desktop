name: Build & Release SHOORA TETHER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      VSCODE_SKIP_NODE_VERSION_CHECK: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_command: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Install root npm dependencies
      - name: Install root dependencies
        shell: cmd
        run: npm ci --ignore-scripts

      # Step 2: Install build/ dependencies (needed for gulp)
      - name: Install build tool dependencies
        shell: cmd
        run: cd build && npm ci --ignore-scripts

      # Step 3: Install all extension packages that have package-lock.json
      # (This provides @vscode/codicons, webview bundles, etc. without triggering native C++ builds)
      - name: Install extension packages
        shell: pwsh
        run: |
          $lockFiles = Get-ChildItem -Path @("extensions", ".vscode\extensions") -Recurse -Filter "package-lock.json" -ErrorAction SilentlyContinue
          foreach ($lock in $lockFiles) {
            $dir = $lock.DirectoryName
            Write-Host "Installing dependencies in: $dir"
            Push-Location $dir
            npm ci --ignore-scripts --no-audit
            Pop-Location
          }

      # Step 4: Ensure Electron TypeScript declarations are present
      - name: Setup Electron Types
        shell: cmd
        run: node build/npm/electronTypes.ts

      # Step 5: Compile core client and extensions
      - name: Compile client and extensions
        shell: cmd
        run: npm run compile-client

      # Step 6: Package Windows x64 binaries
      - name: Package Windows client
        shell: cmd
        run: npm run gulp vscode-win32-x64-min

      # Step 7: Build User Setup (.exe installer via InnoSetup)
      - name: Generate Windows Installer (.exe)
        shell: cmd
        run: npm run gulp vscode-win32-x64-user-setup

      # Step 8: Collect and package release assets
      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null

          # Locate installer exe
          $setupExe = Get-ChildItem -Path ".build\win32-x64" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "release-assets\Shoora-Tether-Setup-x64.exe" -Force
            Write-Host "✅ Prepared: Shoora-Tether-Setup-x64.exe from $($setupExe.FullName)"
          } else {
            Write-Host "⚠️ No .exe installer found in .build\win32-x64. Listing build directory:"
            Get-ChildItem -Path ".build" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
            exit 1
          }

          # Locate and archive portable binaries
          if (Test-Path "..\VSCode-win32-x64") {
            Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "release-assets\Shoora-Tether-win32-x64-portable.zip" -Force
            Write-Host "✅ Prepared: Shoora-Tether-win32-x64-portable.zip"
          }

      # Step 9: Publish to GitHub Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          name: SHOORA TETHER ${{ github.ref_name }}
          body: |
            ## SHOORA TETHER ${{ github.ref_name }}

            ### Windows Installation
            1. Download `Shoora-Tether-Setup-x64.exe`
            2. Run the installer
            3. Launch SHOORA TETHER from the desktop or Start Menu

            ### Portable Edition
            Download `Shoora-Tether-win32-x64-portable.zip` and extract anywhere.
          files: release-assets/*
          fail_on_unmatched_files: false
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
