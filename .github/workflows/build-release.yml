name: Build & Release SHOORA TETHER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Compile SHOORA AI Extension
        shell: pwsh
        run: |
          if (Test-Path "extensions/shoora-ai") {
            cd extensions/shoora-ai
            npm install --no-package-lock
            npx tsc
            cd ../..
          }

      - name: Compile SHOORA TETHER Core
        run: npm run compile

      - name: Package Windows Client & Installer
        shell: pwsh
        run: |
          # 1. Package the full Electron client binary
          npm run gulp vscode-win32-x64-min

          # 2. Add inno updater and update icons
          npm run gulp vscode-win32-x64-inno-updater

          # 3. Build Windows Inno Setup installer
          npm run gulp vscode-win32-x64-user-setup

          # 4. Prepare release directory with exact filename
          New-Item -ItemType Directory -Force -Path "release-assets"
          $setupExe = Get-ChildItem -Path ".build\win32-x64" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "release-assets\Shoora-Tether-Setup-x64.exe" -Force
            Write-Host "Created: release-assets\Shoora-Tether-Setup-x64.exe"
          } else {
            Write-Host "No installer exe found, falling back to archive"
          }

          # 5. Create portable zip
          if (Test-Path "..\VSCode-win32-x64") {
            Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "release-assets\Shoora-Tether-win32-x64-portable.zip" -Force
            Write-Host "Created portable archive"
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          name: SHOORA TETHER ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: false
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
