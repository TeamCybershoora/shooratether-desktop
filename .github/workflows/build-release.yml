name: Build & Release SHOORA TETHER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
        run: |
          call npm ci --ignore-scripts
          call npm run postinstall

      - name: Compile and Package Windows Client
        shell: cmd
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
        run: |
          call npm run compile
          call npm run gulp vscode-win32-x64-min
          call npm run gulp vscode-win32-x64-inno-updater
          call npm run gulp vscode-win32-x64-user-setup

      - name: Prepare Release Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets"
          $setupExe = Get-ChildItem -Path ".build\win32-x64" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "release-assets\Shoora-Tether-Setup-x64.exe" -Force
            Write-Host "Prepared Shoora-Tether-Setup-x64.exe from $($setupExe.FullName)"
          } else {
            Write-Host "Warning: No setup exe found"
          }
          if (Test-Path "..\VSCode-win32-x64") {
            Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "release-assets\Shoora-Tether-win32-x64-portable.zip" -Force
            Write-Host "Prepared Shoora-Tether-win32-x64-portable.zip"
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          name: SHOORA TETHER ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: false
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
